<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-512" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="118" fill="#07090e" />
  <rect width="508" height="508" x="2" y="2" rx="116" fill="none" stroke="url(#pwa-grad-512)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="130" fill="#6366f1" opacity="0.25" filter="url(#glow-512)" />

  <!-- Orbital Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="64" fill="none" stroke="url(#pwa-grad-512)" stroke-width="8" stroke-dasharray="16 10" stroke-opacity="0.65" transform="rotate(-25 256 256)" />

  <!-- Center Diamond Crystal -->
  <path d="M256 96 L384 256 L256 416 L128 256 Z" fill="none" stroke="url(#pwa-grad-512)" stroke-width="20" stroke-linejoin="round" />
  <path d="M256 136 L352 256 L256 376 L160 256 Z" fill="url(#glow-grad-512)" opacity="0.35" />

  <!-- Inner Core Star -->
  <circle cx="256" cy="256" r="48" fill="url(#pwa-grad-512)" />
  <circle cx="256" cy="256" r="24" fill="#ffffff" />
</svg>
