<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pwa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="192" height="192" rx="44" fill="#07090e" />
  <rect width="190" height="190" x="1" y="1" rx="43" fill="none" stroke="url(#pwa-grad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Ambient Glow -->
  <circle cx="96" cy="96" r="48" fill="#6366f1" opacity="0.2" filter="url(#glow)" />

  <!-- Orbital Ring -->
  <ellipse cx="96" cy="96" rx="68" ry="24" fill="none" stroke="url(#pwa-grad)" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.6" transform="rotate(-25 96 96)" />

  <!-- Center Diamond Crystal -->
  <path d="M96 36 L144 96 L96 156 L48 96 Z" fill="none" stroke="url(#pwa-grad)" stroke-width="8" stroke-linejoin="round" />
  <path d="M96 52 L132 96 L96 140 L60 96 Z" fill="url(#glow-grad)" opacity="0.35" />

  <!-- Inner Core Star -->
  <circle cx="96" cy="96" r="18" fill="url(#pwa-grad)" />
  <circle cx="96" cy="96" r="9" fill="#ffffff" />
</svg>
